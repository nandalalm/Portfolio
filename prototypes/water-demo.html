<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water Hero Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --ink: #e8f2ff; --muted: rgba(232,242,255,.6); --pill: rgba(255,255,255,.08); --pill-on: rgba(255,255,255,.9); --pill-on-ink: #04162e; }
  body.sun { --ink: #053a44; --muted: rgba(5,58,68,.65); --pill: rgba(5,58,68,.08); --pill-on: #053a44; --pill-on-ink: #eafcfb; }
  body.dev { --ink: #e6e9ec; --muted: rgba(230,233,236,.55); --pill: rgba(255,255,255,.08); --pill-on: #e6e9ec; --pill-on-ink: #06080b; }
  .right { display: flex; gap: 10px; align-items: center; }
  .devbtn { pointer-events: auto; font: 400 12px 'JetBrains Mono', monospace; border: 0; color: var(--ink); background: var(--pill); padding: 10px 14px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(8px); transition: background .4s, color .4s; }
  .devbtn[aria-pressed="true"] { background: var(--pill-on); color: var(--pill-on-ink); }
  body.dev .bottom h2 { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: clamp(13px, 1.6vw, 16px); }
  .devp { position: fixed; left: 24px; bottom: 24px; font: 12px/1.75 'JetBrains Mono', monospace; color: #c9ced3; background: rgba(8,11,14,.82); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 12px 14px; opacity: 0; transform: translateY(8px); transition: opacity .5s, transform .5s; pointer-events: none; white-space: pre-wrap; max-width: 460px; }
  .devp b { font-weight: 400; color: var(--acc, #7fb4ff); }
  body.dev .devp { opacity: 1; transform: none; }
  @media (max-width: 700px) { .devp { left: 12px; right: 12px; bottom: auto; top: 70px; font-size: 11px; } }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04162e; font-family: 'Space Grotesk', system-ui, sans-serif; color: var(--ink); }
  body.sun { background: #6fd6d8; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  .ui { position: fixed; left: 0; right: 0; pointer-events: none; transition: color .8s; }
  .top { top: 0; display: flex; justify-content: space-between; align-items: center; padding: 22px 28px; }
  .logo { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: .02em; }
  .modes { pointer-events: auto; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--pill); backdrop-filter: blur(8px); transition: background .8s; }
  .modes button { font: 500 13px 'Space Grotesk', sans-serif; border: 0; background: transparent; color: var(--ink); padding: 8px 16px; border-radius: 999px; cursor: pointer; transition: background .4s, color .4s; }
  .modes button[aria-pressed="true"] { background: var(--pill-on); color: var(--pill-on-ink); }
  .bottom { bottom: 0; text-align: center; padding: 0 16px 34px; }
  .bottom h2 { margin: 0; font-weight: 500; font-size: clamp(15px, 2vw, 20px); }
  .bottom p { margin: 8px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
  .err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  @media (max-width: 600px) { .top { padding: 16px; } .modes button { padding: 7px 12px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui top">
  <span class="logo">nandalal.dev</span>
  <div class="right">
    <div class="modes" role="group" aria-label="Water style">
      <button id="bDeep" aria-pressed="true">Deep</button>
      <button id="bSun" aria-pressed="false">Sunlit</button>
    </div>
    <button class="devbtn" id="bDev" aria-pressed="false">&lt;/&gt; dev</button>
  </div>
</div>
<div class="devp" id="devp"></div>
<div class="ui bottom">
  <h2 id="sub">Full-stack developer: web, mobile and AI.</h2>
  <p>move your cursor through the water · click to make a splash</p>
</div>
<div class="err" id="err">This demo needs WebGL2 with float render targets. Try a recent Chrome, Edge or Firefox on desktop.</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
  if (!gl || !gl.getExtension('EXT_color_buffer_float')) {
    document.getElementById('err').style.display = 'flex';
    return;
  }
  gl.getExtension('OES_texture_float_linear');

  const VS = `#version 300 es
  in vec2 p; out vec2 uv;
  void main(){ uv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;

  // Wave equation step: R = height, G = velocity
  const UPDATE = `#version 300 es
  precision highp float; in vec2 uv; out vec4 o;
  uniform sampler2D s; uniform vec2 d;
  void main(){
    vec4 i = texture(s, uv);
    float a = ( texture(s, uv - vec2(d.x,0.)).r + texture(s, uv + vec2(d.x,0.)).r
              + texture(s, uv - vec2(0.,d.y)).r + texture(s, uv + vec2(0.,d.y)).r ) * .25;
    i.g += (a - i.r) * 2.;
    i.g *= .993;
    i.r += i.g;
    i.r *= .998;
    o = i;
  }`;

  const DROP = `#version 300 es
  precision highp float; in vec2 uv; out vec4 o;
  uniform sampler2D s; uniform vec2 c; uniform float r, k, asp;
  void main(){
    vec4 i = texture(s, uv);
    vec2 q = uv - c; q.x *= asp;
    float dd = max(0., 1. - length(q) / r);
    dd = .5 - cos(dd * 3.14159) * .5;
    i.r += dd * k;
    o = i;
  }`;

  const RENDER = `#version 300 es
  precision highp float; in vec2 uv; out vec4 o;
  uniform sampler2D s, nm;
  uniform vec2 d, light;
  uniform float t, mode, asp, K;
  uniform sampler2D atlas; uniform vec2 cell, res; uniform float dev, NG;

  float h(vec2 u){ return texture(s, u).r; }

  // Soft procedural caustic network
  float caus(vec2 p, float t){
    float v = 0.;
    for (int k = 0; k < 3; k++){
      float fk = float(k);
      vec2 q = p + vec2(sin(p.y * .9 + t * .7 + fk * 2.1), cos(p.x * 1.1 - t * .6 + fk)) * .9;
      float w = abs(sin(q.x) * sin(q.y));
      v += pow(1. - w, 7.);
      p = p * 1.55 + vec2(1.3, -.7);
    }
    return v / 3.;
  }

  void main(){
    float hl = h(uv - vec2(d.x,0.)), hr = h(uv + vec2(d.x,0.));
    float hd = h(uv - vec2(0.,d.y)), hu = h(uv + vec2(0.,d.y));
    vec3 n = vec3((hl - hr) * K, (hd - hu) * K, 1.);
    // gentle ambient swell so the surface is never dead flat
    n.xy += vec2(sin(uv.y * 18. + t * .9) + sin(uv.x * 7. - t * .5),
                 cos(uv.x * 15. - t * 1.1) + cos(uv.y * 6. + t * .4)) * .012;
    n = normalize(n);

    vec2 ruv = uv + n.xy * .05;
    float name = texture(nm, ruv).a;
    vec3 V = vec3(0., 0., 1.);

    // ---------- Deep blue: night water, light reflections ----------
    vec3 deep = mix(vec3(.008, .03, .08), vec3(.02, .12, .27), smoothstep(-.1, 1.1, ruv.y));
    deep += vec3(.0, .05, .12) * (1. - length((uv - vec2(.5, .65)) * vec2(asp * .6, 1.)));
    deep = mix(deep, vec3(.62, .78, .95), name * .55);
    vec2 lp = light;
    float rim = clamp(1. - n.z, 0., 1.);
    float wavy = smoothstep(.0005, .02, rim);                     // highlights only where water moves
    vec3 L = normalize(vec3((lp - uv) * vec2(asp, 1.), .8));
    float spec = pow(max(dot(reflect(-L, n), V), 0.), 60.);
    vec3 L2 = normalize(vec3(.35, .8, .6));                       // high moonlight
    float spec2 = pow(max(dot(reflect(-L2, n), V), 0.), 220.);
    deep += (spec * .9 * vec3(.6, .8, 1.) + spec2 * 1.4 * vec3(.9, .95, 1.)) * wavy
          + rim * vec3(.1, .25, .5) * 1.6;

    // ---------- Sunlit: clean turquoise, caustics on the floor ----------
    vec3 sun = mix(vec3(.16, .66, .74), vec3(.48, .90, .88), smoothstep(-.2, 1.2, ruv.y));
    sun = mix(sun, vec3(.03, .33, .40), name * .75);
    float cs = caus(ruv * vec2(asp, 1.) * 3.2 + n.xy * 4., t * .8);
    sun += cs * vec3(.85, 1., .98) * .45;
    vec3 Ls = normalize(vec3(-.3, .5, .8));
    float sspec = pow(max(dot(reflect(-Ls, n), V), 0.), 140.);
    vec3 Lc = normalize(vec3((lp - uv) * vec2(asp, 1.), .8));
    float cspec = pow(max(dot(reflect(-Lc, n), V), 0.), 60.);
    sun += (sspec * 1.5 + cspec * .6) * wavy * vec3(1., 1., .96) + rim * vec3(1.) * .8;

    vec3 col = mix(deep, sun, mode);
    float vig = smoothstep(1.25, .35, length((uv - .5) * vec2(asp, 1.) * .9));
    col *= mix(.55, 1., vig) * mix(1., 1.05, mode);

    // ---------- Dev mode: the same simulation, drawn as characters ----------
    if (dev > .001) {
      vec2 fc = gl_FragCoord.xy;
      vec2 ci = floor(fc / cell);
      vec2 cuv = (ci + .5) * cell / res;
      float ch = texture(s, cuv).r;
      vec2 sl = vec2(texture(s, cuv - vec2(d.x * 2., 0.)).r - texture(s, cuv + vec2(d.x * 2., 0.)).r,
                     texture(s, cuv - vec2(0., d.y * 2.)).r - texture(s, cuv + vec2(0., d.y * 2.)).r);
      float v = clamp(abs(ch) * 70. + length(sl) * 90., 0., 1.);
      float nmA = texture(nm, cuv + sl * 1.2).a;
      float gi = floor(v * (NG - 1.) + .5);
      bool isName = nmA > .45;
      if (isName) gi = max(gi, NG - 3.);
      vec2 ic = fract(fc / cell);
      float ga = texture(atlas, vec2((gi + ic.x) / NG, ic.y)).a;
      vec3 acc = mix(vec3(.45, .70, 1.), vec3(.30, .88, .82), mode);
      vec3 ink = mix(vec3(.80, .83, .86) * (.18 + .82 * v), acc, smoothstep(.12, .85, v) * .85);
      if (isName) ink = mix(vec3(.93, .95, .97), acc, v * .7);
      vec3 asc = mix(vec3(.022, .028, .036), ink, ga);
      float y = 1. - uv.y, p = dev * 1.1;
      float mask = 1. - smoothstep(p - .03, p, y);
      float scan = exp(-abs(y - p) * 160.) * step(dev, .985);
      col = mix(col, asc, mask) + scan * acc * .7;
    }
    o = vec4(col, 1.);
  }`;

  function shader(type, src){
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(fs){
    const p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, VS));
    gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}; p.u = n => u[n] ?? (u[n] = gl.getUniformLocation(p, n));
    return p;
  }
  const pUpd = program(UPDATE), pDrop = program(DROP), pRen = program(RENDER);

  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  let W, H, SW, SH, asp, tex = [], fbo = [], cur = 0, nameTex = gl.createTexture();
  const DPR = Math.min(window.devicePixelRatio || 1, 1.5);

  function simTex(){
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, SW, SH, 0, gl.RGBA, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    return [t, f];
  }

  function drawName(){
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const fs = Math.min(W * 0.155, 230 * DPR);
    x.font = `700 ${fs}px 'Space Grotesk', system-ui, sans-serif`;
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff';
    if ('letterSpacing' in x) x.letterSpacing = `${-fs * 0.03}px`;
    x.fillText('NANDALAL', W / 2, H * 0.46);
    gl.bindTexture(gl.TEXTURE_2D, nameTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

  // Glyph atlas for dev mode: calm → peak
  const GLYPHS = ['·', '-', '~', '=', '+', '*', '#', '%', '@'];
  const atlasTex = gl.createTexture();
  function buildAtlas(){
    const gw = 48, gh = 86, c = document.createElement('canvas');
    c.width = gw * GLYPHS.length; c.height = gh;
    const x = c.getContext('2d');
    x.font = `400 60px 'JetBrains Mono', monospace`;
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff';
    GLYPHS.forEach((g, i) => x.fillText(g, i * gw + gw / 2, gh / 2 + 2));
    gl.bindTexture(gl.TEXTURE_2D, atlasTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  buildAtlas();

  function resize(){
    W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
    canvas.width = W; canvas.height = H; asp = W / H;
    SW = 360; SH = Math.max(120, Math.round(360 / asp));
    tex.forEach(t => gl.deleteTexture(t)); fbo.forEach(f => gl.deleteFramebuffer(f));
    const a = simTex(), b = simTex(); tex = [a[0], b[0]]; fbo = [a[1], b[1]]; cur = 0;
    drawName();
  }

  let calls = 0;
  function pass(prog, set){
    calls++;
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[1 - cur]);
    gl.viewport(0, 0, SW, SH);
    gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex[cur]);
    gl.uniform1i(prog.u('s'), 0);
    set(prog);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    cur = 1 - cur;
  }
  function drop(x, y, r, k){
    pass(pDrop, p => { gl.uniform2f(p.u('c'), x, y); gl.uniform1f(p.u('r'), r); gl.uniform1f(p.u('k'), k); gl.uniform1f(p.u('asp'), asp); });
  }

  // ---------- input ----------
  let mx = -1, my = -1, pmx = -1, pmy = -1, lastMove = 0;
  const light = { x: .7, y: .75, tx: .7, ty: .75 };
  canvas.addEventListener('pointermove', e => {
    mx = e.clientX / innerWidth; my = 1 - e.clientY / innerHeight; lastMove = performance.now();
    light.tx = mx; light.ty = Math.min(1.1, my + .25);
  });
  canvas.addEventListener('pointerleave', () => { mx = my = -1; });
  canvas.addEventListener('pointerdown', e => {
    drop(e.clientX / innerWidth, 1 - e.clientY / innerHeight, .05, .05);
  });

  // ---------- modes ----------
  let mode = 0, modeT = 0;
  const bDeep = document.getElementById('bDeep'), bSun = document.getElementById('bSun');
  function setMode(m){
    modeT = m;
    document.body.classList.toggle('sun', m === 1);
    bDeep.setAttribute('aria-pressed', m === 0); bSun.setAttribute('aria-pressed', m === 1);
    drop(.5, .46, .12, .12);
  }
  bDeep.onclick = () => setMode(0);
  bSun.onclick = () => setMode(1);
  if (location.hash.includes('sun')) setMode(1);

  // ---------- dev mode ----------
  let dev = 0, devT = 0;
  const bDev = document.getElementById('bDev'), sub = document.getElementById('sub'), devp = document.getElementById('devp');
  function setDev(on){
    devT = on ? 1 : 0;
    document.body.classList.toggle('dev', on);
    bDev.setAttribute('aria-pressed', on);
    sub.textContent = on ? '// full-stack developer: web, mobile and AI' : 'Full-stack developer: web, mobile and AI.';
  }
  bDev.onclick = () => setDev(!devT);
  addEventListener('keydown', e => { if (e.key === 'd' || e.key === 'D') setDev(!devT); });
  if (location.hash.includes('dev')) setDev(true);

  // ---------- loop ----------
  const start = performance.now();
  let introDone = false, last = start, fps = 60, ft = 16.7, fc = 0, cv = 0;
  function frame(now){
    const t = (now - start) / 1000;
    const dt = now - last; last = now;
    ft += (dt - ft) * .05; calls = 0;

    if (!introDone && t > .4){ drop(.5, .46, .1, .16); introDone = true; }

    if (mx >= 0 && pmx >= 0){
      const dx = (mx - pmx) * asp, dy = my - pmy, sp = Math.hypot(dx, dy);
      cv += (sp - cv) * .2;
      if (sp > 0.0005) drop(mx, my, .02, Math.min(.02, sp * .5));
    }
    pmx = mx; pmy = my;
    if (now - lastMove > 2500 && Math.random() < .02) drop(Math.random(), Math.random(), .03, .03);

    pass(pUpd, p => gl.uniform2f(p.u('d'), 1 / SW, 1 / SH));
    pass(pUpd, p => gl.uniform2f(p.u('d'), 1 / SW, 1 / SH));

    mode += (modeT - mode) * .05;
    light.x += (light.tx - light.x) * .06; light.y += (light.ty - light.y) * .06;

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.useProgram(pRen);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex[cur]);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, nameTex);
    gl.uniform1i(pRen.u('s'), 0); gl.uniform1i(pRen.u('nm'), 1);
    gl.uniform2f(pRen.u('d'), 1 / SW, 1 / SH);
    gl.uniform2f(pRen.u('light'), light.x, light.y);
    gl.uniform1f(pRen.u('t'), t);
    gl.uniform1f(pRen.u('mode'), mode);
    gl.uniform1f(pRen.u('asp'), asp);
    gl.uniform1f(pRen.u('K'), SW * .35);
    dev += (devT - dev) * .045;
    const small = innerWidth < 760, cellW = (small ? 6 : 10) * DPR, cellH = (small ? 11 : 18) * DPR;
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, atlasTex);
    gl.uniform1i(pRen.u('atlas'), 2);
    gl.uniform2f(pRen.u('cell'), cellW, cellH);
    gl.uniform2f(pRen.u('res'), W, H);
    gl.uniform1f(pRen.u('dev'), dev);
    gl.uniform1f(pRen.u('NG'), GLYPHS.length);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); calls++;

    if (devT && ++fc % 8 === 0){
      document.body.style.setProperty('--acc', modeT ? '#5fe0d2' : '#7fb4ff');
      const cols = Math.ceil(W / cellW), rows = Math.ceil(H / cellH);
      devp.innerHTML =
        `<b>dev mode</b>  same simulation, drawn as text\n` +
        `ripple sim   ${SW}×${SH} · half-float · wave eq.\n` +
        `ascii grid   ${cols}×${rows} cells · ${GLYPHS.join('')}\n` +
        `passes       ${calls} this frame\n` +
        `frame        ${ft.toFixed(1)} ms · ${Math.round(1000 / ft)} fps\n` +
        `cursor       x ${mx < 0 ? '—' : mx.toFixed(2)}  y ${my < 0 ? '—' : my.toFixed(2)}  v ${cv.toFixed(3)}\n` +
        `shaders      update.frag · drop.frag · water+ascii.frag`;
    }

    requestAnimationFrame(frame);
  }

  resize();
  addEventListener('resize', resize);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { drawName(); buildAtlas(); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
